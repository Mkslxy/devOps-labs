name: UniSchool

services:
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME:-unischool}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-unischool}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  api:
    build:
      context: ./api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./api/.env.docker

  celery_worker:
    build:
      context: ./api
    command: celery -A UniSchool worker --loglevel=info
    volumes:
      - ./api:/app
    depends_on:
      - redis
      - db
    env_file:
      - ./api/.env.docker

  celery_beat:
    build:
      context: ./api
    command: celery -A UniSchool beat --loglevel=info
    volumes:
      - ./api:/app
    depends_on:
      - redis
      - db
    env_file:
      - ./api/.env.docker

  front:
    build:
      context: ./front
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      API_INTERNAL_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    command: npm run start

  ngrok:
    image: ngrok/ngrok:latest
    command: http --url=${NGROK_DOMAIN:-nonintercepting-shawnna-nonexpeditious.ngrok-free.dev} api:${NGROK_PORT:-8000}
    env_file:
      - ./api/.env.docker
    environment:
      - NGROK_AUTHTOKEN=${NGROK_TOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - api

volumes:
  postgres_data:

networks:
  default:
    name: unischool_network
