# DVO-L4-3C8B52
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unischool.fullname" . }}-api
  labels:
    {{- include "unischool.labels" . | nindent 4 }}
    app: {{ include "unischool.fullname" . }}-api
  annotations:
    {{- include "unischool.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "unischool.selectorLabels" . | nindent 6 }}
      app: {{ include "unischool.fullname" . }}-api
  template:
    metadata:
      labels:
        {{- include "unischool.labels" . | nindent 8 }}
        app: {{ include "unischool.fullname" . }}-api
      annotations:
        {{- include "unischool.annotations" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command:
            - sh
            - -c
            - 'until python -c "import socket; s = socket.socket(); s.connect((\"{{ include "unischool.fullname" . }}-db\", {{ .Values.config.dbPort }}))"; do echo "Waiting for postgres..."; sleep 2; done;'
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.service.targetPort | default 8000 }}
              name: http
          env:
            - name: APP_VERSION
              value: {{ .Values.api.image.tag | default .Chart.AppVersion | quote }}
            - name: DJANGO_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "unischool.fullname" . }}-secret
                  key: DJANGO_SECRET
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "unischool.fullname" . }}-secret
                  key: DB_PASSWORD
            - name: GEMINI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "unischool.fullname" . }}-secret
                  key: GEMINI_TOKEN
            - name: TG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "unischool.fullname" . }}-secret
                  key: TG_TOKEN
            - name: TG_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "unischool.fullname" . }}-secret
                  key: TG_SECRET
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "unischool.fullname" . }}-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "unischool.fullname" . }}-config
                  key: DB_USER
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "unischool.fullname" . }}-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "unischool.fullname" . }}-config
                  key: DB_PORT
            - name: DJANGO_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "unischool.fullname" . }}-config
                  key: DJANGO_DEBUG
            - name: CELERY_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "unischool.fullname" . }}-config
                  key: CELERY_BROKER_URL
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "unischool.fullname" . }}-config
                  key: FRONTEND_URL
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health/
              port: {{ .Values.api.service.targetPort | default 8000 }}
              httpHeaders:
                - name: Host
                  value: localhost
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/
              port: {{ .Values.api.service.targetPort | default 8000 }}
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/
              port: {{ .Values.api.service.targetPort | default 8000 }}
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
