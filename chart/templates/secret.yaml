# DVO-L4-3C8B52
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "unischool.fullname" . }}-secret
  labels:
    {{- include "unischool.labels" . | nindent 4 }}
    app: {{ include "unischool.fullname" . }}
  annotations:
    {{- include "unischool.annotations" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  DJANGO_SECRET: {{ .Values.secrets.djangoSecret | quote }}
  GEMINI_TOKEN: {{ .Values.secrets.geminiToken | quote }}
  TG_TOKEN: {{ .Values.secrets.tgToken | quote }}
  TG_SECRET: {{ .Values.secrets.tgSecret | quote }}
