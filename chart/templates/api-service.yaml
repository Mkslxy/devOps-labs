# DVO-L4-3C8B52
apiVersion: v1
kind: Service
metadata:
  name: {{ include "unischool.fullname" . }}-api
  labels:
    {{- include "unischool.labels" . | nindent 4 }}
    app: {{ include "unischool.fullname" . }}-api
  annotations:
    {{- include "unischool.annotations" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type | default "ClusterIP" }}
  selector:
    {{- include "unischool.selectorLabels" . | nindent 4 }}
    app: {{ include "unischool.fullname" . }}-api
  ports:
    - protocol: TCP
      port: {{ .Values.api.service.port | default 8000 }}
      targetPort: {{ .Values.api.service.targetPort | default 8000 }}
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
