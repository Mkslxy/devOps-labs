name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  # 1. Статический анализ кода (Линтер)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install linter
        run: pip install ruff

      - name: Run Ruff Lint
        run: ruff check --select=E9,F63,F7,F82 api/

  # 2. Сборка окружения и запуск тестов
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest pytest-django

      - name: Prepare test settings and run Pytest
        run: |
          # Создаем фиктивные переменные окружения, включая Telegram токен
          echo "SECRET_KEY=ci-dummy-key-for-tests-12345" | tee .env api/.env
          echo "DEBUG=True" | tee -a .env api/.env
          echo "ALLOWED_HOSTS=*" | tee -a .env api/.env
          echo "GEMINI_API_KEY=dummy-gemini-key-for-ci" | tee -a .env api/.env
          echo "GOOGLE_API_KEY=dummy-google-key-for-ci" | tee -a .env api/.env
          echo "TELEGRAM_BOT_TOKEN=123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ" | tee -a .env api/.env
          echo "TELEGRAM_TOKEN=123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ" | tee -a .env api/.env

          # Создаем изолированный тестовый модуль настроек
          cat << 'EOF' > api/UniSchool/test_settings.py
          import os
          os.environ["SECRET_KEY"] = "ci-dummy-key-for-tests-12345"
          os.environ["GEMINI_API_KEY"] = "dummy-gemini-key-for-ci"
          os.environ["GOOGLE_API_KEY"] = "dummy-google-key-for-ci"
          os.environ["TELEGRAM_BOT_TOKEN"] = "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"
          os.environ["TELEGRAM_TOKEN"] = "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"
          from UniSchool.settings import *
          SECRET_KEY = "ci-dummy-key-for-tests-12345"
          DEBUG = True
          TELEGRAM_BOT_TOKEN = "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"
          TELEGRAM_TOKEN = "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"
          DATABASES = {
              'default': {
                  'ENGINE': 'django.db.backends.sqlite3',
                  'NAME': ':memory:',
              }
          }
          EOF

          export PYTHONPATH="./api:$PYTHONPATH"
          export DJANGO_SETTINGS_MODULE="UniSchool.test_settings"
          export SECRET_KEY="ci-dummy-key-for-tests-12345"
          export GEMINI_API_KEY="dummy-gemini-key-for-ci"
          export GOOGLE_API_KEY="dummy-google-key-for-ci"
          export TELEGRAM_BOT_TOKEN="123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"
          export TELEGRAM_TOKEN="123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"

          # Запуск стабильных unit-тестов сервисов и логики
          pytest api/apps/users/tests/test_users_utils.py api/apps/classes/tests/test_lesson_service.py api/apps/classes/tests/test_lesson_services_extended.py -o django_settings_module=UniSchool.test_settings

  # 3. Сборка Docker-образа, сканирование и публикация в GHCR
  docker-build-push:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/api:${{ steps.meta.outputs.version }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
