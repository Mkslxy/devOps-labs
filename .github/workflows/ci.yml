name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  # 1. Статичний аналіз коду (Лінтер)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install linter
        run: pip install ruff

      - name: Run Ruff Lint
        run: ruff check --select=E9,F63,F7,F82 api/

  # 2. Збірка середовища та запуск тестів
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest pytest-django

      - name: Prepare test settings and run Pytest
        run: |
          echo "SECRET_KEY=ci-dummy-key-for-tests-12345" | tee .env api/.env
          echo "DEBUG=True" | tee -a .env api/.env
          echo "ALLOWED_HOSTS=*" | tee -a .env api/.env
          echo "GEMINI_API_KEY=dummy-gemini-key-for-ci" | tee -a .env api/.env
          echo "GOOGLE_API_KEY=dummy-google-key-for-ci" | tee -a .env api/.env
          echo "TELEGRAM_BOT_TOKEN=123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ" | tee -a .env api/.env
          echo "TELEGRAM_TOKEN=123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ" | tee -a .env api/.env

          cat << 'EOF' > api/UniSchool/test_settings.py
          import os
          os.environ["SECRET_KEY"] = "ci-dummy-key-for-tests-12345"
          os.environ["GEMINI_API_KEY"] = "dummy-gemini-key-for-ci"
          os.environ["GOOGLE_API_KEY"] = "dummy-google-key-for-ci"
          os.environ["TELEGRAM_BOT_TOKEN"] = "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"
          os.environ["TELEGRAM_TOKEN"] = "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"
          from UniSchool.settings import *
          SECRET_KEY = "ci-dummy-key-for-tests-12345"
          DEBUG = True
          TELEGRAM_BOT_TOKEN = "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"
          TELEGRAM_TOKEN = "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"
          DATABASES = {
              'default': {
                  'ENGINE': 'django.db.backends.sqlite3',
                  'NAME': ':memory:',
              }
          }
          EOF

          export PYTHONPATH="./api:$PYTHONPATH"
          export DJANGO_SETTINGS_MODULE="UniSchool.test_settings"
          export SECRET_KEY="ci-dummy-key-for-tests-12345"
          export GEMINI_API_KEY="dummy-gemini-key-for-ci"
          export GOOGLE_API_KEY="dummy-google-key-for-ci"
          export TELEGRAM_BOT_TOKEN="123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"
          export TELEGRAM_TOKEN="123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"

          pytest api/apps/users/tests/test_users_utils.py api/apps/classes/tests/test_lesson_service.py api/apps/classes/tests/test_lesson_services_extended.py -o django_settings_module=UniSchool.test_settings

  # 3. Збірка Docker-образу, сканування та публікація в GHCR
  docker-build-push:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Перетворюємо ім'я репозиторію в нижній регістр для Docker/GHCR
      - name: Lowercase image name
        id: image_name
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}/api"
          echo "image=$(echo $IMAGE_NAME | tr '[A-Z]' '[a-z]')" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      # Збірка образу (з завантаженням локально в docker демон для сканування Trivy)
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Сканування локально зібраного образу
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image_name.outputs.image }}:latest
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Публікація в реєстр тільки під час push у main/master гілку
      - name: Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
