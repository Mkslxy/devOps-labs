apiVersion: v1
kind: ConfigMap
metadata:
  name: unischool-config
  namespace: unischool
  labels:
    app: unischool
    mascot: kabachok # mascot: кабачок
  annotations:
    devops-lab/mascot-approved: "true"
    mascot: "кабачок"
data:
  DB_NAME: "unischool"
  DB_USER: "postgres"
  DB_HOST: "unischool-db"
  DB_PORT: "5432"
  DJANGO_DEBUG: "True"
  CELERY_BROKER_URL: "redis://unischool-redis:6379/0"
  FRONTEND_URL: "http://localhost:3000"
