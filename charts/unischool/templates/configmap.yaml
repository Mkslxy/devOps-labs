# DVO-L4-3C8B52
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "unischool.fullname" . }}-config
  labels:
    {{- include "unischool.labels" . | nindent 4 }}
    app: {{ include "unischool.fullname" . }}
  annotations:
    {{- include "unischool.annotations" . | nindent 4 }}
data:
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  DB_HOST: {{ default (printf "%s-db" (include "unischool.fullname" .)) .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DJANGO_DEBUG: {{ .Values.config.djangoDebug | quote }}
  CELERY_BROKER_URL: {{ default (printf "redis://%s-redis:6379/0" (include "unischool.fullname" .)) .Values.config.celeryBrokerUrl | quote }}
  FRONTEND_URL: {{ .Values.config.frontendUrl | quote }}
