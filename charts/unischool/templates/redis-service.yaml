# DVO-L4-3C8B52
apiVersion: v1
kind: Service
metadata:
  name: {{ include "unischool.fullname" . }}-redis
  labels:
    {{- include "unischool.labels" . | nindent 4 }}
    app: {{ include "unischool.fullname" . }}-redis
  annotations:
    {{- include "unischool.annotations" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "unischool.selectorLabels" . | nindent 4 }}
    app: {{ include "unischool.fullname" . }}-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
