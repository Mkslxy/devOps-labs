# DVO-L4-3C8B52
# Значення за замовчуванням для UniSchool Helm-чарта (середовище dev)

api:
  replicaCount: 1
  image:
    repository: unischool-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8000
    targetPort: 8000
    nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgres:
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: unischool.local
  path: /
  pathType: Prefix

config:
  dbName: unischool
  dbUser: postgres
  dbPort: "5432"
  djangoDebug: "True"
  frontendUrl: "http://localhost:3000"

secrets:
  dbPassword: "unischool_secure_postgres_pass_2026"
  djangoSecret: "django-insecure-unischool-k8s-lab3-key-2026"
  geminiToken: "unischool-gemini-dev-key"
  tgToken: "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"
  tgSecret: "unischool_telegram_dev_secret"

hooks:
  preUpgrade:
    enabled: true
